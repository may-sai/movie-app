<div class="container">
  <h1 (click)="navigateToHome()">My Movie-DB</h1>
  <div class="actions">
    <button (click)="navigateToWishList()">
      Wish List
      <fa-icon [icon]="faHeart"></fa-icon>
      @if (movieService.wishList().length > 0) {
        <span class="badge">{{ movieService.wishList().length }}</span>
      }
    </button>
    <button (click)="navigateToFavorites()">
      Favorites
      <fa-icon [icon]="faStar"></fa-icon>
      @if (movieService.favoriteList().length > 0) {
        <span class="badge">{{ movieService.favoriteList().length }}</span>
      }
    </button>
    <button (click)="navigateToWatched()">
      Watched
      <fa-icon [icon]="faEye"></fa-icon>
      @if (movieService.watchedList().length > 0) {
        <span class="badge">{{ movieService.watchedList().length }}</span>
      }
    </button>
    <button
      class="theme-btn"
      (click)="themeService.toggleTheme()"
      [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
      [title]="themeService.theme() === 'dark' ? 'Light mode' : 'Dark mode'"
    >
      <fa-icon [icon]="themeService.theme() === 'dark' ? faSun : faMoon"></fa-icon>
    </button>
  </div>
</div>

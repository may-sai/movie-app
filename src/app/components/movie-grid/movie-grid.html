<section class="page">
  <div class="page-header">
    <button class="back-btn" (click)="backToMovieList()">
      <fa-icon [icon]="faArrowLeft"></fa-icon> Back to movie list
    </button>
    <h2>{{ title() }} <span class="count">{{ movies().length }}</span></h2>
  </div>

  @if (movies().length === 0) {
    <p class="empty">{{ emptyMessage() }}</p>
  } @else {
    <div class="container">
      @for (movie of movies(); track movie.id) {
        <div class="movie-card" (click)="openMovie(movie)">
          <img
            [src]="'https://image.tmdb.org/t/p/original' + movie.poster_path"
            [alt]="movie.title"
          >
          <div class="movie-detail">
            <h3>{{ movie.title }}</h3>
          </div>
          <button
            class="remove-btn"
            aria-label="Remove"
            title="Remove"
            (click)="removed.emit(movie); $event.stopPropagation()"
          >
            <fa-icon [icon]="faTrash"></fa-icon>
          </button>
        </div>
      }
    </div>
  }
</section>

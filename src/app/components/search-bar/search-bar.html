<div class="container">
    <div class="search-container">
        <label for="title">Title</label>

        <input
            type="text"
            #movieTitle
            id="title"
            placeholder="Search for a movie..."
            (input)="getMovieByTitle(movieTitle.value)"
        />

        <fa-icon [icon]="faMagnifyingGlass"></fa-icon>
    </div>
</div>
